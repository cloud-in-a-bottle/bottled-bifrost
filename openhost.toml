[app]
name = "bifrost-llm-gateway"
version = "0.1.0"
description = "Bifrost LLM gateway, exposing an OpenAI-compatible endpoint as an OpenHost service."

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/health"

[resources]
memory_mb = 1024
cpu_millicores = 1000

[data]
# Bifrost stores its config + sqlite DB (providers, keys, logs) here.
app_data = true

# Exposes Bifrost's OpenAI-compatible API as an OpenHost service. Caddy gates
# this endpoint behind a `full_access` grant and limits it to the inference API
# (the web UI is not reachable through it). A consumer call to
# .../call/<shortname>/openai/v1/chat/completions reaches Bifrost as
# /openai/v1/chat/completions. See services/openai-compat/.
[[services.v2.provides]]
service = "github.com/imbue-openhost/openhost-bifrost-llm-gateway/services/openai-compat"
version = "0.1.0"
endpoint = "/service/"
